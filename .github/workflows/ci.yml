name: HookRelay CI & Security Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test_and_scan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit

    - name: Run Bandit Security AST Scan
      run: |
        bandit -r app/ -ll -ii

    - name: Run Automated Pytest Suite with Coverage
      env:
        GITHUB_WEBHOOK_SECRET: ci_test_secret_key
        DISCORD_WEBHOOK_URL: https://discord.com/api/webhooks/mock
        DATABASE_URL: sqlite+aiosqlite:///:memory:
        ENVIRONMENT: test
      run: |
        python -m pytest tests/ -v
