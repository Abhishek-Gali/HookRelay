name: "HookRelay CI & DevSecOps Pipeline"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  test_and_scan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0

    - name: Secret Scanning (Gitleaks)
      uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Dependency Review (Pull Requests)
      if: github.event_name == 'pull_request'
      uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0

    - name: Set up Python 3.11
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies & security scanners
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit ruff pip-audit

    - name: Lint with Ruff
      run: |
        ruff check app/ tests/

    - name: Run Bandit Security AST Scan
      run: |
        bandit -r app/ -ll -ii

    - name: Run Dependency Vulnerability Audit (pip-audit)
      run: |
        pip-audit -r requirements.txt

    - name: Run Automated Pytest Suite with Coverage
      env:
        GITHUB_WEBHOOK_SECRET: "ci_test_secret_key_at_least_16_chars"
        DISCORD_WEBHOOK_URL: "https://discord.com/api/webhooks/000000000000000000/mock"
        DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        ENVIRONMENT: "test"
      run: |
        python -m pytest tests/ -v --cov=app --cov-report=term-missing

