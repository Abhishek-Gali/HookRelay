[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hookrelay"
version = "2.2.0"
description = "Security-hardened webhook ingestion & multi-destination delivery gateway (GitHub -> Discord, Slack, HTTP) with HMAC-SHA256, durable SQL queueing, fencing leases, and DLQ."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abhishek Gali" }]
keywords = [
    "webhooks",
    "fastapi",
    "cybersecurity",
    "distributed-systems",
    "event-gateway",
    "discord-webhook",
    "slack-webhook",
    "hmac-sha256",
    "ssrf-protection",
    "dead-letter-queue",
]
dependencies = [
    "fastapi>=0.135.0",
    "starlette>=1.0.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "tenacity>=9.0.0",
    "prometheus-client>=0.21.0",
    "python-dotenv>=1.2.2",
]

[project.urls]
Homepage = "https://github.com/Abhishek-Gali/HookRelay"
Repository = "https://github.com/Abhishek-Gali/HookRelay"
Issues = "https://github.com/Abhishek-Gali/HookRelay/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "respx>=0.22.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "bandit>=1.8.0",
    "pip-audit>=2.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
disable_error_code = ["arg-type", "var-annotated", "attr-defined", "assignment"]


